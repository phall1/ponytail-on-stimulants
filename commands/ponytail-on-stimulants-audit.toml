description = "Audit the repository for incomplete execution and unjustified complexity"
prompt = "Audit the whole repository with bounded scope. Rank correctness/completion blockers first: stale callers, sibling paths, missing migrations/generated artifacts, TODOs, silent failures, and verification gaps. Then report unjustified abstractions, dependencies, or duplication. Number findings and cite path/line evidence. Before deletion, search source, tests, configuration, generated consumers and public interfaces; absence of a source-only grep hit is not proof. Distinguish executed checks from unverified claims. Do not turn the audit into unrelated refactoring."
