name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python deps for inherited correctness checks
        run: pip install pandas==2.3.3
      - name: Install MCP deps
        run: npm install --prefix ponytail-on-stimulants-mcp
      - name: Check generated rules and versions
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Run completion corpus self-test
        run: npm run test:completion
      - name: Run inherited agentic instrument self-tests
        run: |
          python3 benchmarks/agentic/run.py --selftest
          python3 benchmarks/agentic/complete.py --selftest-offline
