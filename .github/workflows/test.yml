name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install -g npm@12.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.15.0'
      - name: Check generated rules and versions
        run: npm run check
      - name: Run tests
        run: uv run --with pandas==3.0.6 -- npm test
      - name: Run completion corpus self-test
        run: npm run test:completion
      - name: Run inherited agentic instrument self-tests
        run: |
          uv run --script benchmarks/agentic/run.py --selftest
          uv run --script benchmarks/agentic/complete.py --selftest-offline
