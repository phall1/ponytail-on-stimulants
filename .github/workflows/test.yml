name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python deps for inherited correctness checks
        run: pip install pandas==2.3.3
      - name: Check generated rules and versions
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Run completion corpus self-test
        run: npm run test:completion
      - name: Run inherited agentic instrument self-tests
        run: |
          python3 benchmarks/agentic/run.py --selftest
          python3 benchmarks/agentic/complete.py --selftest-offline
