name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'phall1/ponytail-on-stimulants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install -g npm@12.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.15.0'
      - name: Require the release commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run check
      - run: uv run --with pandas==3.0.6 -- npm test
      - run: npm run test:completion
      - run: |
          uv run --script benchmarks/agentic/run.py --selftest
          uv run --script benchmarks/agentic/complete.py --selftest-offline
      - run: npm pack --dry-run
      - name: Pack the validated artifact
        run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ponytail-on-stimulants-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: github.repository == 'phall1/ponytail-on-stimulants'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@12.2.0
      - run: node scripts/check-versions.js
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifact
      - run: npm publish ./artifact/ponytail-on-stimulants-*.tgz
