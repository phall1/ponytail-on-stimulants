name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'phall1/ponytail-on-stimulants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require the release commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pip install pandas==2.3.3
      - run: npm install --prefix ponytail-on-stimulants-mcp
      - run: npm run check
      - run: npm test
      - run: npm run test:completion
      - run: |
          python3 benchmarks/agentic/run.py --selftest
          python3 benchmarks/agentic/complete.py --selftest-offline
      - run: npm pack --dry-run
      - name: Pack the validated artifact
        run: npm pack
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-package
          path: ponytail-on-stimulants-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: github.repository == 'phall1/ponytail-on-stimulants'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.19.1
      - run: node scripts/check-versions.js
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: artifact
      - run: npm publish artifact/ponytail-on-stimulants-*.tgz
