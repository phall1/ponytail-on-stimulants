name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'phall1/ponytail-on-stimulants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require the release commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pip install pandas==2.3.3
      - run: npm install --prefix ponytail-on-stimulants-mcp
      - run: npm run check
      - run: npm test
      - run: npm run test:completion
      - run: |
          python3 benchmarks/agentic/run.py --selftest
          python3 benchmarks/agentic/complete.py --selftest-offline
      - run: npm pack --dry-run
      - name: Pack the validated artifact
        run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ponytail-on-stimulants-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: github.repository == 'phall1/ponytail-on-stimulants'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.19.1
      - run: node scripts/check-versions.js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: artifact
      - run: npm publish artifact/ponytail-on-stimulants-*.tgz
